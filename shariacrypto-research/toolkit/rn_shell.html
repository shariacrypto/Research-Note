<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Shariacrypto Research Note</title><style id="base-css">.sc-placeholder { background: color-mix(in srgb, currentcolor 8%, transparent); border: 1px solid color-mix(in srgb, currentcolor, transparent); border-radius: 2px; box-sizing: border-box; overflow: hidden; }
@keyframes sc-shine { 
  0% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}
html.sc-dc-streaming .sc-placeholder, html.sc-dc-streaming .sc-interp.sc-missing { position: relative; background: color-mix(in srgb, currentcolor 5%, transparent); border-color: transparent; }
html.sc-dc-streaming .sc-placeholder::before, html.sc-dc-streaming .sc-interp.sc-missing::before { content: ""; position: absolute; inset: 0px; pointer-events: none; background: linear-gradient(90deg, rgba(217, 119, 87, 0) 25%, rgba(247, 225, 211, 0.95) 37%, rgba(217, 119, 87, 0) 63%) 0% 0% / 400% 100%; animation: 1.4s ease 0s infinite normal none running sc-shine; }
html.sc-dc-streaming .sc-placeholder:nth-child(n+9 of .sc-placeholder)::before, html.sc-dc-streaming .sc-interp.sc-missing:nth-child(n+9 of .sc-interp.sc-missing)::before { animation: auto ease 0s 1 normal none running none; background: color-mix(in srgb, currentcolor 8%, transparent); }
.sc-placeholder-error { padding: 4px 8px; font: 11px / 1.4 ui-monospace, monospace; color: color-mix(in srgb, currentcolor 70%, transparent); word-break: break-word; }
.sc-interp.sc-missing { display: inline-block; width: 2em; height: 1em; overflow: hidden; vertical-align: text-bottom; background: rgba(255, 255, 255, 0.3); border: 1px solid rgba(0, 0, 0, 0.5); border-radius: 2px; box-sizing: border-box; color: transparent; user-select: none; }
.sc-interp.sc-unresolved { font-family: ui-monospace, monospace; font-size: 0.85em; color: color-mix(in srgb, currentcolor, transparent); background: color-mix(in srgb, currentcolor 10%, transparent); border-radius: 3px; padding: 0px 3px; }
.sc-host.sc-has-error { position: relative; }
.sc-logic-error { position: absolute; top: 8px; left: 8px; z-index: 2147483647; max-width: 60ch; padding: 6px 10px; background: rgb(176, 0, 32); color: rgb(255, 255, 255); font: 12px / 1.4 ui-monospace, monospace; border-radius: 4px; white-space: pre-wrap; pointer-events: none; }
@media print {
  @page { margin: 0.5cm; }
  figure, table { break-inside: avoid; }
  #dc-root, #dc-root > .sc-host { height: auto; }
  *, ::before, ::after { print-color-adjust: exact; backdrop-filter: none !important; animation-delay: -99s !important; animation-duration: 0.001s !important; animation-iteration-count: 1 !important; animation-fill-mode: both !important; animation-play-state: running !important; transition-duration: 0s !important; }
}

html, body { height: 100%; margin: 0px; }

:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:auto!important}
body{margin:0;background:var(--bg-base,#020f09)}
#ed-bar{position:sticky;top:0;z-index:50;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:10px 18px;padding-top:calc(10px + env(safe-area-inset-top,0px));background:rgba(4,31,18,.9);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);font:500 12px var(--font-sans),system-ui,sans-serif;color:var(--text-body)}
#ed-bar button,#ed-panel button,#ed-draft button{font:600 12px var(--font-sans),system-ui,sans-serif;padding:6px 12px;border-radius:999px;border:1px solid var(--border);background:transparent;color:var(--text-body);cursor:pointer;white-space:nowrap}
#ed-bar button:disabled,#ed-panel button:disabled{opacity:.4;cursor:default}
#ed-bar button.on{background:var(--success-solid);color:#04140B;border-color:transparent}
#ed-bar button.primary{background:var(--success-solid);color:#04140B;border-color:transparent}
#ed-bar button.gold{background:var(--gold-500);color:#1a1200;border-color:transparent}
.ed-grp{display:flex;align-items:center;gap:4px}
.ed-title{gap:8px}.ed-title strong{color:var(--white);font-size:13px}.ed-title span{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}
.ed-seg{padding:3px;border:1px solid var(--border);border-radius:999px}.ed-seg button{border:0!important}
.ed-right{margin-left:auto;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.ed-status{font-size:11px;color:var(--text-muted);max-width:340px;text-align:right}
#ed-draft{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:60;background:var(--surface-card,#0b3a24);border:1px solid var(--gold-500);border-radius:12px;padding:10px 14px;font:500 12px var(--font-sans),system-ui;color:var(--text-body);display:flex;gap:8px;align-items:center;box-shadow:0 8px 30px rgba(0,0,0,.5)}
body[data-mode="isi"] [data-page] [data-ed]:hover{outline:1px dashed rgba(34,197,94,.45);outline-offset:1px}
body[data-mode="isi"] [data-page] [data-ed]:focus{outline:1px solid var(--success-solid);outline-offset:1px}
body[data-mode="tpl"] [data-page] *{cursor:pointer}
body[data-mode="tpl"] [data-page] *:hover{outline:1px dashed rgba(245,180,0,.55);outline-offset:-1px}
body[data-mode="tpl"] [data-sel]{outline:2px solid var(--gold-500)!important;outline-offset:-1px}
body[data-mode="tpl"] #doc-main{margin-right:340px}
[data-ui="ovf"]{position:absolute;top:8px;right:8px;z-index:5;background:#b91c1c;color:#fff;font:700 10px var(--font-mono),monospace;padding:4px 8px;border-radius:6px}
body[data-mode="baca"] [data-ui="ovf"]{opacity:.85}
#ed-panel:empty{display:none}
#ed-panel{position:fixed;top:0;right:0;bottom:0;width:330px;z-index:40;overflow:auto;background:#06180f;border-left:1px solid var(--border-strong);font:500 12px var(--font-sans),system-ui,sans-serif;color:var(--text-body);box-sizing:border-box}
.ed-ph{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;color:var(--white)}
.ed-ph button{padding:2px 10px!important;font-size:16px!important}
.ed-tabs{display:flex;gap:4px;padding:0 14px 8px;border-bottom:1px solid var(--border)}
.ed-tabs button.on{background:var(--gold-500);color:#1a1200;border-color:transparent}
.ed-body{padding:12px 14px 40px}
.ed-body h4{margin:16px 0 6px;font:700 10px var(--font-mono),monospace;letter-spacing:.08em;color:var(--gold-500);text-transform:uppercase}
.ed-hint{color:var(--text-muted);line-height:1.5;margin:0 0 8px}
.ed-crumbs{display:flex;flex-wrap:wrap;gap:3px;align-items:center;margin-bottom:6px}.ed-crumbs span{color:var(--text-muted)}
.ed-crumbs button{padding:2px 8px!important;font:500 10px var(--font-mono),monospace!important}
.ed-crumbs button.on{border-color:var(--gold-500)!important;color:var(--gold-500)!important}
.ed-sel{font-family:var(--font-mono);font-size:11px;color:var(--white);margin-bottom:8px;word-break:break-word}
.ed-btns{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.ed-btns button{border-radius:8px!important}
.ed-btns button.danger{border-color:var(--danger)!important;color:var(--danger)!important}
.ed-check{display:flex;gap:6px;align-items:center;margin-top:10px;color:var(--text-muted)}
.ed-props{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ed-props label,.ed-full{display:flex;flex-direction:column;gap:3px;font-size:10.5px;color:var(--text-muted)}
.ed-props code{font-size:9px;color:var(--text-muted);opacity:.7}
#ed-panel input,#ed-panel textarea{width:100%;box-sizing:border-box;background:#0a2618;border:1px solid var(--border);border-radius:6px;color:var(--white);padding:5px 7px;font:500 11px var(--font-sans),system-ui}
#ed-panel textarea{resize:vertical;margin-bottom:6px}
#ed-panel input[type=checkbox]{width:auto;flex:none}
#ed-panel .mono{font:400 10.5px var(--font-mono),monospace}
.ed-ins>div{display:grid;grid-template-columns:1fr auto auto;gap:5px;align-items:center;padding:4px 0;border-bottom:1px solid var(--border)}
@media (max-width:900px){body[data-mode="tpl"] #doc-main{margin-right:0}#ed-panel{top:auto;left:0;width:auto;height:48vh;padding-top:0;border-left:0;border-top:1px solid var(--border-strong)}}
@media print{
  @page{size:A4;margin:0}
  [data-noprint],[data-ui],#ed-bar,#ed-panel,#ed-draft{display:none!important}
  :root{padding:0!important}
  body{background:none!important}
  #doc-main{margin:0!important}
  [data-main]{padding:0!important;gap:0!important}
  [data-page]{box-shadow:none!important;break-after:page;page-break-after:always}
  [data-page]:last-child{break-after:auto;page-break-after:auto}

/* ---------- document build / save ---------- */
function buildDocument(s){
  var base=document.getElementById('base-css').textContent;
  var js=document.getElementById('editor-js').textContent;
  var data=JSON.stringify(s?{html:s.html,css:s.css,theme:s.theme||{},title:s.title||DOC.title}:{html:cleanHTML(),css:DOC.css,theme:DOC.theme,title:DOC.title}).replace(/</g,'\\u003c');
  var sc='scr'+'ipt', st='sty'+'le';
  return '<!doctype html>\n<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>'+esc(DOC.title)+'</title>'+
    '<'+st+' id="base-css">'+base+'</'+st+'><'+st+' id="doc-custom-css"></'+st+'></head><body>'+
    '<div id="ed-bar" data-noprint></div><div id="doc-main"></div><div id="ed-panel" data-noprint></div>'+
    '<'+sc+' type="application/json" id="doc-data">'+data+'</'+sc+'>'+
    '<'+sc+' id="editor-js">'+js+'</'+sc+'></body></html>';
}
function setStatus(m){statusMsg=m;renderBar()}
function publish(){
  if(!artifactNS){setStatus('Penyimpanan versi hanya tersedia saat dibuka di claude.ai. Perubahan tetap tersimpan sebagai draf di browser ini; gunakan Unduh HTML untuk menyimpan file.');return}
  recordHist('publish',true);
  var html=buildDocument(); setStatus('Menyimpan versi…');
  var keep=null;try{keep=localStorage.getItem(KEY)}catch(e){}
  clearDraft();
  artifactNS.publish(html).then(function(){dirty=false;setStatus('Versi tersimpan. Halaman dimuat ulang…')},function(err){
    try{if(keep)localStorage.setItem(KEY,keep)}catch(e){}
    var c=err&&err.code;
    if(c==='conflict')setStatus('Ada versi lebih baru yang sudah terbit; halaman dimuat ulang ke versi itu. Draf Anda tetap ada di browser ini.');
    else if(c==='not_writer'||c==='not_granted'||c==='consent_required'||c==='not_declared'||c==='capability_disabled'||c==='capability_removed'){readOnly=true;setStatus('')}
    else if(c==='too_large')setStatus('Dokumen terlalu besar untuk disimpan.');
    else if(c==='rate_limited')setStatus('Terlalu sering menyimpan. Tunggu sebentar lalu coba lagi.');
    else setStatus('Gagal menyimpan ('+(c||'error')+'). Draf tetap tersimpan di browser ini.');
  });
}
function download(){
  var html=buildDocument(), name='research-note-'+(DOC.title||'dokumen').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,60)+'.html';
  if(downloadsNS){downloadsNS.save({filename:name,data:html}).then(function(){setStatus('File HTML diunduh.')},function(e){if(e&&e.code!=='declined')setStatus('Unduhan tidak tersedia di sini.')});return}
  if(window.claude){setStatus('Unduhan tidak tersedia di tampilan ini.');return}
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));a.download=name;document.body.appendChild(a);a.click();a.remove();
}

var LIBS=['https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js','https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js'];
function loadScript(src){return new Promise(function(res,rej){var s=document.createElement('scr'+'ipt');s.src=src;s.onload=res;s.onerror=function(){rej(new Error('load '+src))};s.setAttribute('data-noprint','');document.head.appendChild(s)})}
var libsP=null;
function loadLibs(){if(!libsP)libsP=Promise.all(LIBS.map(loadScript)).catch(function(e){libsP=null;throw e});return libsP}
var pdfBusy=false;
function pdfName(){return (DOC.title||'research-note').replace(/[\\/:*?"<>|]+/g,'').replace(/\s+/g,' ').trim().slice(0,120)+'.pdf'}
function makePdf(){
  if(pdfBusy)return;pdfBusy=true;
  var prevMode=mode;setMode('baca');
  main.querySelectorAll('[data-ui]').forEach(function(e){e.style.display='none'});
  setStatus('Menyiapkan PDF…');
  var done=function(msg){pdfBusy=false;setMode(prevMode);setStatus(msg)};
  loadLibs().then(function(){
    var ps=pages(),H=window.htmlToImage,JS=window.jspdf&&window.jspdf.jsPDF;
    if(!H||!JS)throw new Error('lib');
    var doc=new JS({unit:'mm',format:'a4',orientation:'portrait',compress:true});
    var fontCss=null;
    return H.getFontEmbedCSS(ps[0]).then(function(c){fontCss=c},function(){fontCss=null}).then(function(){
      var chain=Promise.resolve();
      ps.forEach(function(p,i){chain=chain.then(function(){
        setStatus('Menyiapkan PDF… halaman '+(i+1)+' dari '+ps.length);
        var opt={pixelRatio:2.2,quality:0.92,cacheBust:false,style:{boxShadow:'none',margin:'0'},filter:function(n){return !(n.nodeType===1&&n.hasAttribute&&n.hasAttribute('data-ui'))}};
        if(fontCss)opt.fontEmbedCSS=fontCss;
        return H.toJpeg(p,opt).then(function(url){if(i>0)doc.addPage('a4','portrait');doc.addImage(url,'JPEG',0,0,210,297,undefined,'FAST')});
      })});
      return chain;
    }).then(function(){
      doc.setProperties({title:DOC.title});
      var blob=doc.output('blob'),name=pdfName();
      if(downloadsNS)return downloadsNS.save({filename:name,data:blob}).then(function(){done('PDF diunduh.')},function(e){done(e&&e.code==='declined'?'Unduhan PDF dibatalkan.':'Unduhan PDF tidak tersedia di tampilan ini ('+(e&&e.code||'error')+').')});
      if(window.claude){done('Unduhan tidak tersedia di tampilan ini.');return}
      var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();done('PDF diunduh.');
    });
  }).catch(function(err){
    done('');
    try{window.print()}catch(e){setStatus('Gagal membuat PDF. Coba muat ulang halaman.')}
  }).then(function(){main.querySelectorAll('[data-ui]').forEach(function(e){e.style.display=''})});
}

function op(o){
  if(o==='close'){setMode('isi');return}
  if(!sel&&['applycss'].indexOf(o)<0)return;
  var s=sel,p,n;
  switch(o){
    case 'parent':if(s.parentElement&&s.parentElement!==wrap()&&s.parentElement!==main)select(s.parentElement);break;
    case 'child':if(s.firstElementChild)select(s.firstElementChild);break;
    case 'prev':if(s.previousElementSibling)select(s.previousElementSibling);break;
    case 'next':if(s.nextElementSibling&&!s.nextElementSibling.hasAttribute('data-ui'))select(s.nextElementSibling);break;
    case 'up':p=s.previousElementSibling;if(p){pushUndo();p.before(s);afterChange()}break;
    case 'down':n=s.nextElementSibling;if(n&&!n.hasAttribute('data-ui')){pushUndo();n.after(s);afterChange()}break;
    case 'dup':pushUndo();n=s.cloneNode(true);n.removeAttribute('data-sel');s.after(n);select(n);afterChange();break;
    case 'del':
      if(s.hasAttribute('data-page')&&(pages().length<2||!confirm('Hapus seluruh halaman ini?')))return;
      pushUndo();n=s.nextElementSibling&&!s.nextElementSibling.hasAttribute('data-ui')?s.nextElementSibling:(s.previousElementSibling||s.parentElement);
      s.remove();select(n&&n!==wrap()?n:null);afterChange();break;
    case 'copy':clip=s.outerHTML.replace(/ data-sel=""/g,'');renderPanel();break;
    case 'paste':if(clip)insert(clip,'after');break;
    case 'applystyle':pushUndo();s.setAttribute('style',val('style'));afterChange();break;
    case 'applyhtml':n=frag(val('html'));if(!n){alert('HTML tidak valid.');return}pushUndo();s.replaceWith(n);select(n);applyMode();afterChange();break;
    case 'insfree':n=frag(val('free'));if(!n){alert('HTML tidak valid.');return}pushUndo();s.after(n);select(n);applyMode();afterChange();break;
    case 'applycss':pushUndo();DOC.css=val('css');applyTheme();afterChange();break;
    case 'pagedup':p=s.closest('[data-page]');if(!p)return;pushUndo();n=p.cloneNode(true);n.querySelectorAll('[data-sel],[data-ui]').forEach(function(x){x.removeAttribute('data-sel');if(x.hasAttribute('data-ui'))x.remove()});n.removeAttribute('data-sel');p.after(n);select(n);afterChange();break;
    case 'pageblank':p=s.closest('[data-page]');if(!p)return;pushUndo();n=p.cloneNode(true);n.removeAttribute('data-sel');
      Array.prototype.slice.call(n.children).forEach(function(c,i){if(i===0||c.tagName==='HEADER'||c.tagName==='FOOTER')return;c.remove()});
      var hd=n.querySelector(':scope > header');var para=frag(SNIP.paragraf);if(hd)hd.after(para);else n.appendChild(para);
      p.after(n);select(para);afterChange();break;
  }
}

  else if((e.key==='Delete'||e.key==='Backspace')&&sel){e.preventDefault();op('del')}
});

/* ---------- riwayat draf ---------- */
var HMAX=60, VER=KEY.slice(14), HDB=null, histLast=0, histLastHash='', histTimer=null;
var HLABEL={auto:'Simpan otomatis',close:'Saat halaman ditutup',publish:'Sebelum Simpan versi',restore:'Sebelum memulihkan riwayat',draft:'Draf aktif',old:'Draf dari versi lain'};
function idb(){
  if(HDB)return HDB;
  HDB=new Promise(function(res,rej){
    try{var r=indexedDB.open('sc-note-history',1);
      r.onupgradeneeded=function(){var db=r.result;if(!db.objectStoreNames.contains('snaps'))db.createObjectStore('snaps',{keyPath:'id',autoIncrement:true})};
      r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)};
    }catch(e){rej(e)}
  });
  HDB.catch(function(){});return HDB;
}
function hReq(mode,fn){return idb().then(function(db){return new Promise(function(res,rej){var tx=db.transaction('snaps',mode);var os=tx.objectStore('snaps');var out=fn(os);tx.oncomplete=function(){res(out&&out.result!==undefined?out.result:undefined)};tx.onerror=function(){rej(tx.error)};tx.onabort=function(){rej(tx.error)}})})}
function hAll(){return hReq('readonly',function(os){return os.getAll()}).then(function(a){return (a||[]).sort(function(x,y){return y.t-x.t})})}
function hPut(rec){return hReq('readwrite',function(os){os.put(rec)})}
function hDel(id){return hReq('readwrite',function(os){os.delete(id)})}
function hTrim(){return hAll().then(function(a){var p=Promise.resolve();a.slice(HMAX).forEach(function(r){p=p.then(function(){return hDel(r.id)})});return p})}
function recHash(s){return hash(s.html+s.css+JSON.stringify(s.theme||{}))}
function recordHist(src,force){
  if(readOnly)return Promise.resolve();
  var s=snap();
  if(s.html===DOC.html&&s.css===DOC.css)return Promise.resolve();
  var h=recHash(s);
  if(h===histLastHash)return Promise.resolve();
  if(!force&&Date.now()-histLast<45000)return Promise.resolve();
  histLast=Date.now();histLastHash=h;
  return hPut({t:Date.now(),src:src,ver:VER,h:h,html:s.html,css:s.css,theme:s.theme,title:s.title}).then(hTrim).then(function(){if(document.getElementById('ed-hist'))fillHist()}).catch(function(){});
}
function histTick(){
  var wait=45000-(Date.now()-histLast);
  if(wait<=0){recordHist('auto');return}
  if(!histTimer)histTimer=setTimeout(function(){histTimer=null;recordHist('auto')},wait+50);
}
function importDrafts(){
  var keys=[];try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.indexOf('sc-note-draft:')===0)keys.push(k)}}catch(e){return}
  if(!keys.length)return;
  hAll().then(function(a){
    var have={};a.forEach(function(r){have[r.h]=1});
    var p=Promise.resolve();
    keys.forEach(function(k){
      var d=null;try{d=JSON.parse(localStorage.getItem(k)||'null')}catch(e){}
      if(!d||!d.html)return;
      if(d.html===DOC.html&&d.css===DOC.css)return;
      var h=recHash(d);if(have[h])return;have[h]=1;
      p=p.then(function(){return hPut({t:d.t||0,src:k===KEY?'draft':'old',ver:k.slice(14),h:h,html:d.html,css:d.css,theme:d.theme||{},title:d.title||DOC.title})});
    });
    return p.then(hTrim);
  }).catch(function(){});
}
function textItems(html){
  var t=document.createElement('template');t.innerHTML=html;var root=t.content;
  var ps=root.querySelectorAll('[data-page]');var out=[];
  Array.prototype.forEach.call(ps,function(pg,pi){
    pg.querySelectorAll('[data-ed]').forEach(function(el){
      if(el.querySelector('[data-ed]'))return;
      var s=(el.textContent||'').replace(/\s+/g,' ').trim();if(s)out.push({p:pi+1,s:s});
    });
  });
  return out;
}
function diffItems(A,B){
  var n=A.length,m=B.length,W=m+1,L=new Uint16Array((n+1)*W);
  for(var i=n-1;i>=0;i--)for(var j=m-1;j>=0;j--)L[i*W+j]=A[i].s===B[j].s?L[(i+1)*W+j+1]+1:Math.max(L[(i+1)*W+j],L[i*W+j+1]);
  var ops=[],i2=0,j2=0;
  while(i2<n&&j2<m){if(A[i2].s===B[j2].s){ops.push({k:'eq'});i2++;j2++}else if(L[(i2+1)*W+j2]>=L[i2*W+j2+1]){ops.push({k:'del',x:A[i2++]})}else{ops.push({k:'add',x:B[j2++]})}}
  while(i2<n)ops.push({k:'del',x:A[i2++]});while(j2<m)ops.push({k:'add',x:B[j2++]});
  var out=[],cur=null;
  ops.forEach(function(o){if(o.k==='eq'){cur=null;return}if(!cur||(cur.lastK==='add'&&o.k==='del')){cur={del:[],add:[],p:o.x.p};out.push(cur)}cur[o.k].push(o.x.s);cur.lastK=o.k});
  return out;
}
function diffHTML(rec){
  var ch=diffItems(textItems(DOC.html),textItems(rec.html));
  if(rec.css!==DOC.css)ch.unshift({p:'–',del:[],add:['(Ada perubahan template/CSS)']});
  if(!ch.length)return '<div class="h-diff">Teksnya sama dengan versi terbit (mungkin hanya beda format).</div>';
  return '<div class="h-diff">'+ch.slice(0,120).map(function(c){
    return '<div class="h-ch"><span class="h-pg">Hal '+c.p+'</span>'+
      c.del.map(function(s){return '<div class="h-del">− '+esc(s)+'</div>'}).join('')+
      c.add.map(function(s){return '<div class="h-add">+ '+esc(s)+'</div>'}).join('')+'</div>';
  }).join('')+(ch.length>120?'<div class="h-note">…dan '+(ch.length-120)+' perubahan lain.</div>':'')+'</div>';
}
function histCSS(){
  if(document.getElementById('ed-hist-css'))return;
  var st=document.createElement('style');st.id='ed-hist-css';
  st.textContent='#ed-hist{position:fixed;top:56px;right:12px;bottom:12px;width:min(460px,calc(100vw - 24px));z-index:70;background:#06180f;border:1px solid var(--border-strong,#2a5);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.55);display:flex;flex-direction:column;font:500 12px var(--font-sans),system-ui,sans-serif;color:var(--text-body)}'+
  '#ed-hist .h-head{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--border)}'+
  '#ed-hist .h-head strong{color:var(--white);font-size:13px}'+
  '#ed-hist .h-note{padding:8px 14px;color:var(--text-muted);font-size:11px;line-height:1.5}'+
  '#ed-hist .h-list{overflow:auto;padding:4px 10px 12px;flex:1}'+
  '#ed-hist .h-item{border:1px solid var(--border);border-radius:10px;padding:9px 10px;margin:6px 0;background:rgba(255,255,255,.02)}'+
  '#ed-hist .h-item.cur{border-color:var(--gold-500)}'+
  '#ed-hist .h-meta{display:flex;justify-content:space-between;gap:8px;align-items:baseline}'+
  '#ed-hist .h-time{color:var(--white);font-weight:600}'+
  '#ed-hist .h-src{color:var(--text-muted);font-size:11px}'+
  '#ed-hist .h-tag{font-size:10px;padding:1px 7px;border-radius:999px;border:1px solid var(--border);color:var(--text-muted)}'+
  '#ed-hist .h-tag.old{border-color:var(--gold-500);color:var(--gold-500)}'+
  '#ed-hist .h-btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}'+
  '#ed-hist button{font:600 11px var(--font-sans),system-ui,sans-serif;padding:4px 10px;border-radius:999px;border:1px solid var(--border);background:transparent;color:var(--text-body);cursor:pointer}'+
  '#ed-hist button.pri{border-color:var(--success-solid);color:var(--success-solid)}'+
  '#ed-hist button.dng{color:var(--danger)}'+
  '#ed-hist .h-diff{margin-top:8px;max-height:320px;overflow:auto;border-top:1px dashed var(--border);padding-top:6px}'+
  '#ed-hist .h-ch{margin:6px 0;line-height:1.45}'+
  '#ed-hist .h-pg{display:inline-block;font-size:10px;color:var(--text-muted);margin-bottom:2px}'+
  '#ed-hist .h-del{color:#ff8a80;text-decoration:line-through;opacity:.9}'+
  '#ed-hist .h-add{color:#7ee2a8}'+
  '@media print{#ed-hist{display:none!important}}';
  document.head.appendChild(st);
}
function openHist(){
  var d=document.getElementById('ed-hist');if(d){d.remove();return}
  histCSS();
  d=document.createElement('div');d.id='ed-hist';d.setAttribute('data-noprint','');
  d.innerHTML='<div class="h-head"><strong>Riwayat draf</strong><button data-h="close" title="Tutup">Tutup ×</button></div>'+
    '<div class="h-note">Tersimpan otomatis di browser ini: tiap ±1 menit selama Anda mengedit, sebelum <b>Simpan versi</b>, dan saat halaman ditutup. Draf lama dari versi sebelumnya ikut dimasukkan. Maks. '+HMAX+' catatan; hanya ada di browser &amp; perangkat ini.</div>'+
    '<div class="h-list">Memuat…</div>';
  document.body.appendChild(d);
  d.addEventListener('click',histClick);
  recordHist('auto',true).then(fillHist,fillHist);
}
var histCache=[];
function fillHist(){
  var d=document.getElementById('ed-hist');if(!d)return;var list=d.querySelector('.h-list');
  hAll().then(function(a){
    histCache=a;
    if(!a.length){list.innerHTML='<div class="h-note">Belum ada riwayat. Riwayat mulai tercatat setelah Anda mengedit isi.</div>';return}
    var curH=recHash(snap());
    list.innerHTML=a.map(function(r){
      var other=r.ver!==VER;
      return '<div class="h-item'+(r.h===curH?' cur':'')+'" data-id="'+r.id+'">'+
        '<div class="h-meta"><span class="h-time">'+esc(r.t?new Date(r.t).toLocaleString('id-ID'):'Waktu tidak diketahui')+'</span>'+
        '<span class="h-tag'+(other?' old':'')+'">'+(other?'versi lain':'versi ini')+'</span></div>'+
        '<div class="h-src">'+esc(HLABEL[r.src]||r.src)+(r.h===curH?' · sama dengan tampilan sekarang':'')+'</div>'+
        '<div class="h-btns"><button data-h="diff">Lihat perubahan</button><button data-h="restore" class="pri">Pulihkan</button><button data-h="dl">Unduh HTML</button><button data-h="del" class="dng">Hapus</button></div>'+
        '<div class="h-out"></div></div>';
    }).join('');
  },function(){list.innerHTML='<div class="h-note">Riwayat tidak bisa dibuka di browser ini (penyimpanan diblokir atau mode pribadi).</div>'});
}
function histClick(e){
  var b=e.target.closest('button');if(!b)return;var a=b.dataset.h;
  if(a==='close'){document.getElementById('ed-hist').remove();return}
  var it=b.closest('.h-item');if(!it)return;var id=+it.dataset.id;
  var rec=histCache.filter(function(r){return r.id===id})[0];if(!rec)return;
  var out=it.querySelector('.h-out');
  if(a==='diff'){if(out.innerHTML){out.innerHTML='';b.textContent='Lihat perubahan';return}out.innerHTML='<div class="h-note">Membandingkan dengan versi terbit…</div>';b.textContent='Sembunyikan';setTimeout(function(){try{out.innerHTML=diffHTML(rec)}catch(err){out.innerHTML='<div class="h-note">Gagal membandingkan.</div>'}},20)}
  else if(a==='restore'){
    recordHist('restore',true).then(function(){
      pushUndo();restore({html:rec.html,css:rec.css,theme:rec.theme||{},title:rec.title||DOC.title});
      setStatus('Riwayat '+new Date(rec.t||Date.now()).toLocaleString('id-ID')+' dipulihkan. Periksa, lalu klik Simpan versi.');
      fillHist();
    });
  }
  else if(a==='dl'){downloadHTML(buildDocument(rec),'riwayat-'+new Date(rec.t||Date.now()).toISOString().slice(0,16).replace(/[:T]/g,'-'))}
  else if(a==='del'){if(!confirm('Hapus catatan riwayat ini dari browser?'))return;hDel(id).then(fillHist)}
}
function downloadHTML(html,suffix){
  var name='research-note-'+(DOC.title||'dokumen').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,50)+(suffix?'-'+suffix:'')+'.html';
  if(downloadsNS){downloadsNS.save({filename:name,data:html}).then(function(){setStatus('File HTML diunduh.')},function(e){if(e&&e.code!=='declined')setStatus('Unduhan tidak tersedia di sini.')});return}
  if(window.claude){setStatus('Unduhan tidak tersedia di tampilan ini.');return}
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));a.download=name;document.body.appendChild(a);a.click();a.remove();
}
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden'&&dirty)recordHist('close',true)});
window.addEventListener('pagehide',function(){if(dirty)recordHist('close',true)});

/* ---------- init ---------- */
applyTheme();
main.innerHTML=DOC.html;
varList();
var draft=null;try{draft=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}
if(draft&&(draft.html!==DOC.html||draft.css!==DOC.css||JSON.stringify(draft.theme)!==JSON.stringify(DOC.theme))){
  var bn=document.createElement('div');bn.id='ed-draft';bn.setAttribute('data-noprint','');
  bn.innerHTML='Ada draf yang belum disimpan dari '+new Date(draft.t||Date.now()).toLocaleString('id-ID')+'. <button data-d="load">Pulihkan draf</button><button data-d="drop">Buang</button>';
  document.body.appendChild(bn);
  bn.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;if(b.dataset.d==='load'){pushUndo();restore(draft)}else clearDraft();bn.remove()});
}
applyMode();renumber();
importDrafts();
window.addEventListener('resize',function(){requestAnimationFrame(checkOverflow)});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){checkOverflow()});
if(window.claude&&typeof window.claude.use==='function'){
  window.claude.use('artifact').then(function(a){artifactNS=a;renderBar()},function(){});
  window.claude.use('downloads').then(function(d){downloadsNS=d},function(){});
}
})();
</script></body></html>
